name: release-build

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
  
jobs:
  build:
    name: Release Build (${{ matrix.target }}) 
    runs-on: ${{ matrix.os }}

    env:
      SCRIPTS_DIR: ${GITHUB_WORKSPACE}/.github/scripts
      PRE_BUILD_SCRIPTS_LOCAL: pre-build
      DEPENDS_BUILD_PREFIX: /usr/local
      BUILD_PREFIX: /usr/local
      BUILD_DIR: ${BUILD_PREFIX}/release-build
      WINDOWSRUB_COMMIT: 0a07f60f20035e6bf6974784988b5ef02a3f57ed
      CXXOPTS_COMMIT: ad6e41343d4ed239c6579a8e87c0a66b709d04be
      FFNVCODEC_TAG: n12.1.14.1
      FFMPEG_TAG: n8.1.3
      WINDOWSRUB_REP: https://github.com/XY-ShadowK/windowsRub.git
      CXXOPTS_REP: https://github.com/jarro2783/cxxopts.git
      FFNVCODEC_REP: https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
      FFMPEG_REP: https://github.com/FFmpeg/FFmpeg.git
      WINDOWSRUB_LOCAL: windowsRub
      CXXOPTS_LOCAL: cxxopts
      FFNVCODEC_LOCAL: nv_codec_headers
      FFMPEG_LOCAL: FFmpeg

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, cl]
        include:
          - target: windows
            os: windows-latest
            crt: MINGW64
            c_compiler: cl
            cpp_compiler: cl
          - target: linux
            os: ubuntu-latest
            crt: ''
            c_compiler: gcc
            cpp_compiler: g++
    defaults:
      run:
        shell: ${{ matrix.target == 'windows' && 'msys2 {0}' || 'bash' }}
        working-directory: $SCRIPTS_DIR
    steps:
    - uses: actions/checkout@v4

    - name: Setup Windows
      if: matrix.target == 'windows'
      uses:  msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.crt }}
        update: false
        cahe: true
        install: >-
          base-devel
          git
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-nasm
          mingw-w64-x86_64-yasm
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-make
          mingw-w64-x86_64-cmake
          autoconf automake libtool

    - name: Setup Linux
      if: matrix.target == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential cmake git pkg-config \
          nasm yasm libtool autoconf automake \
          zlib1g-dev \
          libva-dev libvdpau-dev \
          libc6-dev
    
    - name: WindowsRub Cache
      id: cache-windowsRub
      uses: actions/cache@v5
      with:
        path: ${DEPENDS_BUILD_PREFIX}/${WINDOWSRUB_LOCAL}
        key: windowsRub-${{ matrix.target }}-${{ WINDOWSRUB_COMMIT }}-${{ hashFiles('${SCRIPTS_DIR}/pre-build.sh') }}
        restore-keys: |
          windowsRub-${{ matrix.target }}-${{ WINDOWSRUB_COMMIT }}-
    
    - name: CXXOPTS Cache
      id: cache-cxxopts
      uses: actions/cache@v5
      with:
        path: ${DEPENDS_BUILD_PREFIX}/${CXXOPTS_LOCAL}
        key: cxxopts-${{ matrix.target }}-${{ CXXOPTS_COMMIT }}-${{ hashFiles('${SCRIPTS_DIR}/pre-build.sh') }}
        restore-keys: |
          cxxopts-${{ matrix.target }}-${{ CXXOPTS_COMMIT }}-
    
    - name: FFnvcodec Cache
      id: cache-ffnvcodec
      uses: actions/cache@v5
      with:
        path: ${DEPENDS_BUILD_PREFIX}/${FFNVCODEC_LOCAL}
        key: ffnvcodec-${{ matrix.target }}-${{ FFNVCODEC_TAG }}-${{ hashFiles('${SCRIPTS_DIR}/pre-build.sh') }}
        restore-keys: |
          ffnvcodec-${{ matrix.target }}-${{ FFNVCODEC_TAG }}-

    - name: FFmpeg Cache
      id: cache-ffmpeg
      uses: actions/cache@v5
      with:
        path: ${DEPENDS_BUILD_PREFIX}/${FFMPEG_LOCAL}/build
        key: ffmpeg-${{ matrix.target }}-${{ FFMPEG_TAG }}-${{ hashFiles('${SCRIPTS_DIR}/pre-build-ffmpeg.sh') }}
        restore-keys: |
          ffmpeg-${{ matrix.target }}-${{ FFMPEG_TAG }}-

    - name: WindowsRub Install
      if: steps.cache-windowsRub.outputs.cache-hit != 'true'
      run: echo "WINDOWSRUB_NEED_INSTALL=1" >> "$GITHUB_ENV"

    - name: CXXOPTS Install
      if: steps.cache-cxxopts.outputs.cache-hit != 'true'
      run: echo "CXXOPTS_NEED_INSTALL=1" >> "$GITHUB_ENV"

    - name: FFnvcodec Install
      if: steps.cache-ffnvcodec.outputs.cache-hit != 'true'
      run: echo "FFNVCODEC_NEED_INSTALL=1" >> "$GITHUB_ENV"

    - name: FFmpeg Install
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: echo "FFMPEG_NEED_INSTALL=1" >> "$GITHUB_ENV"

    - name: Pre Build
      run: |
        ./pre-build.sh "${{ matrix.target }}"

    - name: Build
      run: |
        ./build.sh "${{ matrix.target }}"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.target }}
        path: |
          $BUILD_DIR
        retention-days: 7
        if-no-files-found: error