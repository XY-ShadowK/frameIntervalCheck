name: release-build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  SCRIPTS_DIR: ${{ github.workspace }}/.github/scripts
  PRE_BUILD_SCRIPTS_NAME: pre-build
  DEPENDS_BUILD_PREFIX: ${{ github.workspace }}/dependency
  
jobs:
  build:
    name: Release Build (${{ matrix.target }}) 
    runs-on: ${{ matrix.os }}

    env:
      BUILD_DIR: ${{ github.workspace }}/release-build
      WINDOWSRUB_NAME: windowsRub
      CXXOPTS_NAME: cxxopts
      FFNVCODEC_NAME: nv-codec-headers
      FFMPEG_NAME: FFmpeg
      WINDOWSRUB_COMMIT: ba2fbc1699b34d05c6403918e0f3913b20f578d7
      CXXOPTS_COMMIT: ad6e41343d4ed239c6579a8e87c0a66b709d04be
      FFNVCODEC_TAG: n12.1.14.1
      FFMPEG_TAG: n8.1.3
      WINDOWSRUB_REPO: https://github.com/XY-ShadowK/windowsRub.git
      CXXOPTS_REPO: https://github.com/jarro2783/cxxopts.git
      FFNVCODEC_REPO: https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
      FFMPEG_REPO: https://github.com/FFmpeg/FFmpeg.git
      WINDOWSRUB_LICENSE: Mozilla Public License 2.0
      CXXOPTS_LICENSE: MIT License
      FFNVCODEC_LICENSE: MIT License
      FFMPEG_LICENSE: GNU Lesser General Public License v2.1 (LGPLv2.1)

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        include:
          - target: windows
            os: windows-latest
            shell: 'msys2 {0}'
            build_type: Release
            crt: MINGW64
            c_compiler: cl
            cpp_compiler: cl
          - target: linux
            os: ubuntu-latest
            shell: bash
            build_type: Release
            crt: ''
            c_compiler: gcc
            cpp_compiler: g++
    defaults:
      run:
      #  shell: ${{ matrix.target == 'windows' && 'msys2 {0}' || 'bash' }}
        shell: ${{ matrix.shell }}
        working-directory: ${{ env.SCRIPTS_DIR }}
    steps:
    - uses: actions/checkout@v6

    - name: Setup Windows
      if: matrix.target == 'windows'
      uses:  msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.crt }}
        update: false
        cahe: true
        install: >-
          base-devel
          git
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-nasm
          mingw-w64-x86_64-yasm
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-make
          mingw-w64-x86_64-cmake
          autoconf automake libtool

    - name: Setup Linux
      if: matrix.target == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y \
          build-essential cmake git pkg-config \
          nasm yasm libtool autoconf automake \
          zlib1g-dev \
          libva-dev libvdpau-dev \
          libc6-dev
    
    - name: WindowsRub Cache
      id: cache-windowsRub
      uses: actions/cache@v5
      with:
        path: ${{ env.DEPENDS_BUILD_PREFIX}}/${{ env.WINDOWSRUB_NAME}}
        key: windowsRub-${{ matrix.target }}-${{ env.WINDOWSRUB_COMMIT }}-${{ hashFiles(format('{0}/pre-build.sh', env.SCRIPTS_DIR), format('{0}/{1}/pre-build-header-only-commit.sh', env.SCRIPTS_DIR, env.PRE_BUILD_SCRIPTS_NAME)) }}
        restore-keys: |
          windowsRub-${{ matrix.target }}-${{ env.WINDOWSRUB_COMMIT }}-
    
    - name: CXXOPTS Cache
      id: cache-cxxopts
      uses: actions/cache@v5
      with:
        path: ${{ env.DEPENDS_BUILD_PREFIX}}/${{ env.CXXOPTS_NAME}}
        key: cxxopts-${{ matrix.target }}-${{ env.CXXOPTS_COMMIT }}-${{ hashFiles(format('{0}/pre-build.sh', env.SCRIPTS_DIR), format('{0}/{1}/pre-build-header-only-commit.sh', env.SCRIPTS_DIR, env.PRE_BUILD_SCRIPTS_NAME)) }}
        restore-keys: |
          cxxopts-${{ matrix.target }}-${{ env.CXXOPTS_COMMIT }}-
    
    - name: FFnvcodec Cache
      id: cache-ffnvcodec
      uses: actions/cache@v5
      with:
        path: ${{ env.DEPENDS_BUILD_PREFIX }}/${{ env.FFNVCODEC_NAME }}/build
        key: ffnvcodec-${{ matrix.target }}-${{ env.FFNVCODEC_TAG }}-${{ hashFiles(format('{0}/pre-build.sh', env.SCRIPTS_DIR), format('{0}/{1}/pre-build-header-only-branch.sh', env.SCRIPTS_DIR, env.PRE_BUILD_SCRIPTS_NAME)) }}
        restore-keys: |
          ffnvcodec-${{ matrix.target }}-${{ env.FFNVCODEC_TAG }}-

    - name: FFmpeg Cache
      id: cache-ffmpeg
      uses: actions/cache@v5
      with:
        path: ${{ env.DEPENDS_BUILD_PREFIX }}/${{ env.FFMPEG_NAME }}/build
        key: ffmpeg-${{ matrix.target }}-${{ env.FFMPEG_TAG }}-${{ hashFiles(format('{0}/{1}/pre-build-ffmpeg.sh', env.SCRIPTS_DIR, env.PRE_BUILD_SCRIPTS_NAME)) }}
        restore-keys: |
          ffmpeg-${{ matrix.target }}-${{ env.FFMPEG_TAG }}-

    - name: WindowsRub Install
      if: steps.cache-windowsRub.outputs.cache-hit != 'true'
      run: echo "WINDOWSRUB_NEED_INSTALL=1" >> "$GITHUB_ENV"

    - name: CXXOPTS Install
      if: steps.cache-cxxopts.outputs.cache-hit != 'true'
      run: echo "CXXOPTS_NEED_INSTALL=1" >> "$GITHUB_ENV"

    - name: FFnvcodec Install
      if: steps.cache-ffnvcodec.outputs.cache-hit != 'true'
      run: echo "FFNVCODEC_NEED_INSTALL=1" >> "$GITHUB_ENV"

    - name: FFmpeg Install
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: echo "FFMPEG_NEED_INSTALL=1" >> "$GITHUB_ENV"

    - name: Pre Build
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" ./pre-build.sh

    - name: Build
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" ./build.sh

    - name: Get License
      run: |
        chmode +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" ./

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.target }}
        path: |
          ${{ env.BUILD_DIR }}
        retention-days: 7
        if-no-files-found: error