name: release-build

on:
  push:
    tags:
      - v*
  workflow_dispatch:

env:
  PROJECT_NAME: frameIntervalCheck
  SCRIPTS_PATH: ${{ github.workspace }}/.github/scripts
  PRE_BUILD_SCRIPTS_LOCAL: pre-build
  DEPENDS_BUILD_PREFIX: ${{ github.workspace }}/dependency
  DEPENDS_BUILD_LOCAL: build
  BUILD_PATH: ${{ github.workspace }}/release-build
  RELEASE_PATH: ${{ github.workspace }}/release
  GPG_SIGN_SUFFIX: sig
  
jobs:
  build:
    name: Release Build (${{ matrix.target }}) 
    runs-on: ${{ matrix.os }}

    env:
      WINDOWSRUB_NAME: windowsRub
      CXXOPTS_NAME: cxxopts
      FFNVCODEC_NAME: nv-codec-headers
      FFMPEG_NAME: FFmpeg
      WINDOWSRUB_COMMIT: f927b9a7abd561f5e87b76a5561f2bb4ef545cf4
      CXXOPTS_COMMIT: ad6e41343d4ed239c6579a8e87c0a66b709d04be
      FFNVCODEC_TAG: n12.1.14.1
      FFMPEG_TAG: n8.1.3
      WINDOWSRUB_REPO: https://github.com/XY-ShadowK/windowsRub.git
      CXXOPTS_REPO: https://github.com/jarro2783/cxxopts.git
      FFNVCODEC_REPO: https://git.videolan.org/git/ffmpeg/nv-codec-headers.git
      FFMPEG_REPO: https://github.com/FFmpeg/FFmpeg.git
      WINDOWSRUB_LICENSE: Mozilla Public License 2.0
      CXXOPTS_LICENSE: MIT License
      FFNVCODEC_LICENSE: MIT License
      FFMPEG_LICENSE: GNU Lesser General Public License v2.1 (LGPLv2.1)

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      matrix:
        include:
          - target: windows
            os: windows-latest
            shell: 'msys2 {0}'
            build_type: Release
            crt: MINGW64
            c_compiler: cl
            cpp_compiler: cl
          - target: linux
            os: ubuntu-latest
            shell: bash
            build_type: Release
            crt: ''
            c_compiler: gcc
            cpp_compiler: g++
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: ${{ env.SCRIPTS_PATH }}
    steps:
    - uses: actions/checkout@v6

    - name: Setup Windows
      if: matrix.target == 'windows'
      uses:  msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.crt }}
        update: false
        cache: true
        install: >-
          base-devel
          git
          mingw-w64-x86_64-toolchain
          mingw-w64-x86_64-nasm
          mingw-w64-x86_64-yasm
          mingw-w64-x86_64-pkgconf
          mingw-w64-x86_64-zlib
          mingw-w64-x86_64-make
          mingw-w64-x86_64-cmake
          autoconf automake libtool

    - name: Setup Linux
      if: matrix.target == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential cmake git pkg-config \
          nasm yasm libtool autoconf automake \
          zlib1g-dev \
          libva-dev libvdpau-dev \
          libc6-dev
    
    - name: WindowsRub Cache
      id: cache-windowsRub
      uses: actions/cache@v5
      with:
        path: ${{ env.DEPENDS_BUILD_PREFIX}}/${{ env.WINDOWSRUB_NAME}}
        key: windowsRub-${{ matrix.target }}-${{ env.WINDOWSRUB_COMMIT }}-${{ hashFiles(format('{0}/pre-build.sh', env.SCRIPTS_PATH), format('{0}/{1}/pre-build-header-only-commit.sh', env.SCRIPTS_PATH, env.PRE_BUILD_SCRIPTS_LOCAL)) }}
        restore-keys: |
          windowsRub-${{ matrix.target }}-${{ env.WINDOWSRUB_COMMIT }}-
    
    - name: CXXOPTS Cache
      id: cache-cxxopts
      uses: actions/cache@v5
      with:
        path: ${{ env.DEPENDS_BUILD_PREFIX}}/${{ env.CXXOPTS_NAME}}
        key: cxxopts-${{ matrix.target }}-${{ env.CXXOPTS_COMMIT }}-${{ hashFiles(format('{0}/pre-build.sh', env.SCRIPTS_PATH), format('{0}/{1}/pre-build-header-only-commit.sh', env.SCRIPTS_PATH, env.PRE_BUILD_SCRIPTS_LOCAL)) }}
        restore-keys: |
          cxxopts-${{ matrix.target }}-${{ env.CXXOPTS_COMMIT }}-
    
    - name: FFnvcodec Cache
      id: cache-ffnvcodec
      uses: actions/cache@v5
      with:
        path: ${{ env.DEPENDS_BUILD_PREFIX }}/${{ env.FFNVCODEC_NAME }}/${{ env.DEPENDS_BUILD_LOCAL }}
        key: ffnvcodec-${{ matrix.target }}-${{ env.FFNVCODEC_TAG }}-${{ hashFiles(format('{0}/pre-build.sh', env.SCRIPTS_PATH), format('{0}/{1}/pre-build-header-only-branch.sh', env.SCRIPTS_PATH, env.PRE_BUILD_SCRIPTS_LOCAL)) }}
        restore-keys: |
          ffnvcodec-${{ matrix.target }}-${{ env.FFNVCODEC_TAG }}-

    - name: FFmpeg Cache
      id: cache-ffmpeg
      uses: actions/cache@v5
      with:
        path: ${{ env.DEPENDS_BUILD_PREFIX }}/${{ env.FFMPEG_NAME }}/${{ env.DEPENDS_BUILD_LOCAL }}
        key: ffmpeg-${{ matrix.target }}-${{ env.FFMPEG_TAG }}-${{ hashFiles(format('{0}/{1}/pre-build-ffmpeg.sh', env.SCRIPTS_PATH, env.PRE_BUILD_SCRIPTS_LOCAL)) }}

    - name: Test WindowsRub Installed
      if: steps.cache-windowsRub.outputs.cache-hit != 'true'
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" "
        source ./dependency-cache-check.sh \"${{ env.DEPENDS_BUILD_PREFIX }}/${{ env.WINDOWSRUB_NAME }}\" windwosRub WINDOWSRUB_NEED_INSTALL
        "

    - name: Test CXXOPTS Installed
      if: steps.cache-cxxopts.outputs.cache-hit != 'true'
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" "
        source ./dependency-cache-check.sh \"${{ env.DEPENDS_BUILD_PREFIX }}/${{ env.CXXOPTS_NAME }}\" cxxopts CXXOPTS_NEED_INSTALL
        "

    - name: Test FFnvcodec Installed
      if: steps.cache-ffnvcodec.outputs.cache-hit != 'true'
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" "
        source ./dependency-cache-check.sh \"${{ env.DEPENDS_BUILD_PREFIX }}/${{ env.FFNVCODEC_NAME }}/${{ env.DEPENDS_BUILD_LOCAL }}\" ffnvcodec FFNVCODEC_NEED_INSTALL
        "

    - name: Test FFmpeg Installed
      if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" "
        source ./dependency-cache-check.sh \"${{ env.DEPENDS_BUILD_PREFIX }}/${{ env.FFMPEG_NAME }}/${{ env.DEPENDS_BUILD_LOCAL }}\" ffmpeg FFMPEG_NEED_INSTALL
        "

    - name: Pre Build
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" ./pre-build.sh

    - name: Build
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" ./build.sh

    - name: Collect Release
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" ./collect-release.sh

    - name: Get License
      run: |
        chmod +x ./convert-path-run.sh
        ./convert-path-run.sh "${{ matrix.target }}" ./get-license.sh

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-result-${{ matrix.target }}
        path: |
          ${{ env.RELEASE_PATH }}
        retention-days: 7
        if-no-files-found: error

  test-and-publish:
    needs: build
    name: Test and Publish (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    environment: PUBLISH
    permissions:
      contents: write

    env:
      TEST_PATH: ${{ github.workspace }}/test
      PACKAGE_PATH: ${{ github.workspace }}/package

    strategy:
      fail-fast: false

      matrix:
        include:
          - target: windows
            os: windows-latest
            shell: pwsh
            release-suffix: zip
          - target: linux
            os: ubuntu-latest
            shell: bash
            release-suffix: tar.gz
    defaults:
      run:
        shell: ${{ matrix.shell }}
        working-directory: ${{ github.workspace }}

    steps:
    - uses: actions/checkout@v6
    
    - name: Setup (Windows)
      if: matrix.target == 'windows'
      run: |
        # choco install gpg4win -yes --no-progress

    - name: Setup (Linux)
      if: matrix.target == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libva2 libvdpau1

    - name: Download Artifacts
      uses: actions/download-artifact@v5
      with:
        name: build-result-${{ matrix.target }}
        path: ${{ env.RELEASE_PATH }}
    
    - name: Test Build (Windows)
      if: matrix.target == 'windows'
      run: |
        Copy-Item -Path "${{ env.RELEASE_PATH }}/*" -Destination "${{ env.TEST_PATH }}" -Recurse
        Set-Location "${{ env.TEST_PATH }}"
        $output = & "./${{ env.PROJECT_NAME }}" --version
        $version = "${{ github.ref_name }}"
        if ($version.StartsWith('v')) {
          $version = $version.Substring(1)
        } else {
          $version = 'undefined'
        }
        Write-Output "$output"
        Write-Output "${{ env.PROJECT_NAME }} $version"
        if ($output -match "${{ env.PROJECT_NAME }} $version") {
          Write-Output "test succeeded."
        } else {
          Write-Error "test failed." -ErrorAction Stop
        }
    
    - name: Test Build (Linux)
      if: matrix.target == 'linux'
      run: |
        mkdir -p "${{ env.TEST_PATH }}"
        tar -xzf "${{ env.RELEASE_PATH }}/build-result-${{ matrix.target }}.${{ matrix.release-suffix }}" -C "${{ env.TEST_PATH }}"
        cd "${{ env.TEST_PATH }}"
        chmod +x ./"${{ env.PROJECT_NAME }}"
        output=$(./"${{ env.PROJECT_NAME }}" --version)
        version="${{ github.ref_name }}"
        if [[ "$version" == v* ]]; then
          version="${version#v}"
        else
          version="undefined"
        fi
        echo "$output"
        echo "${{ env.PROJECT_NAME }} ${version}"
        if [ "$output" == "${{ env.PROJECT_NAME }} ${version}" ]; then
          echo "test succeeded."
          else
            echo "test failed."
            exit -1
        fi

    - name: Package Release (Windows)
      if: matrix.target == 'windows'
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRI }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASS }}
        GPG_EMAIL: ${{ secrets.GPG_EMAIL }}
      run: |
        New-Item -ItemType Directory -Path "${{ env.PACKAGE_PATH }}"
        Set-Location "${{ env.PACKAGE_PATH }}"
        Compress-Archive -Path "${{ env.RELEASE_PATH }}" -DestinationPath "${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.release-suffix }}"
        git archive --format=${{ matrix.release-suffix }} --prefix="${{ env.PROJECT_NAME }}-${{ github.ref_name }}/" HEAD -o "${{ env.PROJECT_NAME}}-${{ github.ref_name }}.${{ matrix.release-suffix }}"
        $keyFile = [System.IO.Path]::GetTempFileName()
        Set-Content -Path $keyFile -Value "${{ env.GPG_PRIVATE_KEY }}"
        gpg --batch --import $keyFile
        Remove-Item $keyFile
        $gpgArgs = @(
          '--batch', '--yes', '--pinentry-mode', 'loopback',
          '--local-user', "${{ env.GPG_EMAIL }}",
          '--passphrase', "${{ env.GPG_PASSPHRASE }}",
          '--detach-sign',
          "${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.release-suffix }}"
        )
        gpg $gpgArgs
        $gpgArgs[-1] = "${{ env.PROJECT_NAME}}-${{ github.ref_name }}.${{ matrix.release-suffix }}"
        gpg $gpgArgs
          

    - name: Package Release (Linux)
      if: matrix.target == 'linux'
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRI }}
        GPG_PASSPHRASE: ${{ secrets.GPG_PASS }}
        GPG_EMAIL: ${{ secrets.GPG_EMAIL }}
      run: |
        mkdir -p "${{ env.PACKAGE_PATH }}"
        cd "${{ env.PACKAGE_PATH }}"
        mv "${{ env.RELEASE_PATH }}/build-result-${{ matrix.target }}.${{ matrix.release-suffix }}" "${{ env.PACKAGE_PATH }}/${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.release-suffix }}"
        git archive --format=${{ matrix.release-suffix }} --prefix="${{ env.PROJECT_NAME }}-${{ github.ref_name }}/" HEAD -o "${{ env.PROJECT_NAME}}-${{ github.ref_name }}.${{ matrix.release-suffix }}"
        echo "${GPG_PRIVATE_KEY}" > key.txt
        gpg --batch --import key.txt
        rm -f key.txt
        gpgArgs=(
          '--batch' '--yes' '--pinentry-mode' 'loopback'
          '--local-user' "${{ env.GPG_EMAIL }}"
          '--passphrase' "${{ env.GPG_PASSPHRASE }}"
          '--detach-sign'
          "${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.release-suffix }}"
        )
        gpg "${gpgArgs[@]}"
        gpgArgs[-1]="${{ env.PROJECT_NAME}}-${{ github.ref_name }}.${{ matrix.release-suffix }}"
        gpg "${gpgArgs[@]}"
          

    - name: Publish Release
      uses: softprops/action-gh-release@v3
      if: github.ref_type == 'tag'
      with:
        body: "# ${{ github.ref_name }}"
        preserve_order: true
        working_directory: "${{ env.PACKAGE_PATH }}"
        generate_release_notes: true
        files: |
          ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.release-suffix }}
          ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.release-suffix }}.${{ env.GPG_SIGN_SUFFIX }}
          ${{ env.PROJECT_NAME}}-${{ github.ref_name }}.${{ matrix.release-suffix }}
          ${{ env.PROJECT_NAME}}-${{ github.ref_name }}.${{ matrix.release-suffix }}.${{ env.GPG_SIGN_SUFFIX }}

    - name: Publish Release (Test)
      uses: softprops/action-gh-release@v3
      if: github.ref_type != 'tag'
      with:
        body: "# ${{ github.ref_name }}"
        draft: true
        preserve_order: true
        working_directory: "${{ env.PACKAGE_PATH }}"
        generate_release_notes: true
        files: |
          ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.release-suffix }}
          ${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.release-suffix }}.${{ env.GPG_SIGN_SUFFIX }}
          ${{ env.PROJECT_NAME}}-${{ github.ref_name }}.${{ matrix.release-suffix }}
          ${{ env.PROJECT_NAME}}-${{ github.ref_name }}.${{ matrix.release-suffix }}.${{ env.GPG_SIGN_SUFFIX }}